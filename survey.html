<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Path — Ada, the National College for Digital Skills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ada-black: #0a0a0a;
      --ada-dark: #111111;
      --ada-card: #1a1a1a;
      --ada-border: #2a2a2a;
      --ada-green: #00e5a0;
      --ada-green-dark: #00b880;
      --ada-white: #ffffff;
      --ada-grey: #888888;
      --ada-light-grey: #cccccc;
      --ada-warning: #ff6b35;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--ada-black);
      color: var(--ada-white);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: var(--ada-black);
    }

    /* ---- SCREEN TRANSITIONS ---- */
    /* Screens are invisible/inert by default */
    .screen {
      display: none;
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 24px;
    }

    /* Only the active screen is shown */
    .screen.active {
      display: block;
      opacity: 1;
      transition: opacity 0.25s ease-in-out;
    }

    /* Mid-fade: still in DOM but invisible, about to be hidden */
    .screen.fading {
      display: block;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }

    /* ---- ADA LOGO ---- */
    .ada-logo {
      display: inline-flex;
      align-items: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ada-white);
      line-height: 1;
    }

    .ada-logo .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--ada-green);
      border-radius: 50%;
      margin-left: 3px;
      flex-shrink: 0;
    }

    /* ---- BUTTONS ---- */
    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      text-align: center;
      text-decoration: none;
      min-height: 52px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--ada-green);
      color: var(--ada-black);
    }

    .btn-primary:hover {
      background: var(--ada-green-dark);
    }

    .btn-secondary {
      background: transparent;
      color: var(--ada-white);
      border: 2px solid var(--ada-border);
    }

    .btn-secondary:hover {
      border-color: var(--ada-green);
      color: var(--ada-green);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ada-grey);
      font-size: 15px;
      font-weight: 600;
      text-decoration: underline;
      padding: 14px 24px;
    }

    .btn-ghost:hover {
      color: var(--ada-white);
    }

    /* ---- CARDS ---- */
    .card {
      background: var(--ada-card);
      border: 1px solid var(--ada-border);
      border-radius: 12px;
      padding: 20px;
    }

    /* ====================================================
       SCREEN 1: WELCOME
    ==================================================== */
    #screen-welcome.active {
      display: flex;
      flex-direction: column;
      padding-top: 20px;
      padding-bottom: 40px;
      min-height: 100%;
    }

    .welcome-logo-row {
      margin-bottom: 48px;
    }

    .welcome-body {
      flex: 1;
    }

    .welcome-headline {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.03;
      margin-bottom: 20px;
    }

    .welcome-headline .hl-green {
      color: var(--ada-green);
    }

    .welcome-sub {
      font-size: 18px;
      color: var(--ada-light-grey);
      line-height: 1.55;
      margin-bottom: 10px;
    }

    .welcome-time {
      font-size: 14px;
      color: var(--ada-grey);
      margin-bottom: 40px;
    }

    .returning-banner {
      background: var(--ada-card);
      border: 1px solid rgba(0, 229, 160, 0.25);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }

    .returning-banner-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ada-green);
      margin-bottom: 6px;
    }

    .returning-banner-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--ada-white);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .btn-see-last {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      background: transparent;
      border: 2px solid rgba(0, 229, 160, 0.3);
      color: var(--ada-green);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .btn-see-last:hover {
      border-color: var(--ada-green);
      background: rgba(0, 229, 160, 0.06);
    }

    .welcome-cta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ====================================================
       SCREEN 2: QUIZ
    ==================================================== */
    #screen-quiz {
      padding-top: 0;
      padding-left: 0;
      padding-right: 0;
    }

    .quiz-sticky-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--ada-black);
      padding: 20px 24px 0;
    }

    .quiz-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .quiz-q-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--ada-grey);
      letter-spacing: 0.03em;
    }

    .progress-track {
      height: 3px;
      background: var(--ada-border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--ada-green);
      border-radius: 2px;
      width: 0%;
      transition: width 0.35s ease;
    }

    .quiz-body {
      padding: 24px 24px 40px;
    }

    .question-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    .options-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 18px 20px;
      background: var(--ada-card);
      border: 2px solid var(--ada-border);
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--ada-white);
      cursor: pointer;
      text-align: left;
      min-height: 60px;
      transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover:not(:disabled) {
      border-color: rgba(0, 229, 160, 0.5);
      transform: translateX(3px);
    }

    .option-btn.selected {
      border-color: var(--ada-green);
      background: rgba(0, 229, 160, 0.07);
      color: var(--ada-green);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-check {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--ada-green);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.6);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .option-btn.selected .option-check {
      opacity: 1;
      transform: scale(1);
    }

    .option-check svg {
      width: 14px;
      height: 14px;
    }

    /* ====================================================
       SCREEN 3: CALCULATING
    ==================================================== */
    #screen-calculating.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
    }

    .calc-logo {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ada-white);
      display: inline-flex;
      align-items: center;
      animation: calcPulse 1.4s ease-in-out infinite;
    }

    .calc-logo .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--ada-green);
      border-radius: 50%;
      margin-left: 4px;
    }

    @keyframes calcPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.96); }
    }

    .calc-label {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      color: var(--ada-grey);
      letter-spacing: 0.01em;
    }

    /* ====================================================
       SCREEN 4: RESULTS
    ==================================================== */
    #screen-results {
      padding-bottom: 64px;
    }

    .results-logo-row {
      margin-bottom: 24px;
    }

    .results-eyebrow {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ada-green);
      margin-bottom: 8px;
    }

    .results-headline {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 28px;
    }

    /* --- Top match card --- */
    .top-match-card {
      background: var(--ada-card);
      border: 2px solid var(--ada-green);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .top-match-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--ada-green) 0%, rgba(0,229,160,0.1) 100%);
    }

    .top-match-meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .top-match-emoji {
      font-size: 36px;
      line-height: 1;
    }

    .top-match-pct-block {
      text-align: right;
    }

    .top-match-pct-num {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ada-green);
      line-height: 1;
    }

    .top-match-pct-num sup {
      font-size: 22px;
      font-weight: 700;
    }

    .top-match-pct-label {
      font-size: 12px;
      color: var(--ada-grey);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .top-match-name {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .top-match-tagline {
      font-size: 13px;
      font-weight: 700;
      color: var(--ada-green);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .match-bar-track {
      height: 6px;
      background: var(--ada-border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .match-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--ada-green-dark), var(--ada-green));
      border-radius: 3px;
      width: 0%;
      transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .top-match-desc {
      font-size: 15px;
      color: var(--ada-light-grey);
      line-height: 1.65;
      margin-bottom: 18px;
    }

    .course-detail-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .course-detail-row {
      display: flex;
      gap: 10px;
      font-size: 13px;
    }

    .course-detail-label {
      color: var(--ada-grey);
      font-weight: 700;
      min-width: 90px;
      flex-shrink: 0;
    }

    .course-detail-val {
      color: var(--ada-light-grey);
      line-height: 1.4;
    }

    .top-match-link {
      display: block;
      width: 100%;
      padding: 13px 18px;
      border-radius: 8px;
      background: transparent;
      border: 2px solid var(--ada-border);
      color: var(--ada-white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }

    .top-match-link:hover {
      border-color: var(--ada-green);
      color: var(--ada-green);
    }

    /* --- Why section --- */
    .why-section {
      margin-bottom: 28px;
    }

    .section-heading {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 14px;
    }

    .why-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .why-item {
      display: flex;
      gap: 10px;
      font-size: 14px;
      color: var(--ada-light-grey);
      line-height: 1.6;
    }

    .why-arrow {
      color: var(--ada-green);
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* --- T Level callout --- */
    .tlevel-callout {
      border-left: 3px solid var(--ada-green);
      background: rgba(0, 229, 160, 0.04);
      border-radius: 0 12px 12px 0;
      border-top: 1px solid rgba(0, 229, 160, 0.15);
      border-right: 1px solid rgba(0, 229, 160, 0.15);
      border-bottom: 1px solid rgba(0, 229, 160, 0.15);
      margin-bottom: 28px;
      overflow: hidden;
    }

    .tlevel-toggle-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .tlevel-toggle-label {
      font-size: 15px;
      font-weight: 700;
      color: var(--ada-green);
    }

    .tlevel-toggle-sub {
      font-size: 13px;
      color: var(--ada-grey);
      margin-top: 2px;
    }

    .tlevel-chevron {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--ada-green);
      transition: transform 0.25s ease;
    }

    .tlevel-chevron.open {
      transform: rotate(180deg);
    }

    .tlevel-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
    }

    .tlevel-body.open {
      max-height: 600px;
    }

    .tlevel-inner {
      padding: 0 20px 20px;
    }

    .tlevel-headline {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    .tlevel-facts {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tlevel-facts li {
      display: flex;
      gap: 10px;
      font-size: 14px;
      color: var(--ada-light-grey);
      line-height: 1.55;
    }

    .tlevel-facts li::before {
      content: '✓';
      color: var(--ada-green);
      font-weight: 800;
      flex-shrink: 0;
    }

    .tlevel-stat-note {
      font-size: 13px;
      color: var(--ada-grey);
      font-style: italic;
    }

    /* --- Apprenticeship note --- */
    .apprenticeship-note {
      display: flex;
      gap: 10px;
      background: var(--ada-card);
      border: 1px solid rgba(255, 107, 53, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 14px;
      color: var(--ada-light-grey);
      line-height: 1.55;
    }

    .apprenticeship-note-icon {
      font-size: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .apprenticeship-note-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--ada-warning);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    /* --- Other courses --- */
    .other-courses-heading {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ada-grey);
      margin-bottom: 12px;
    }

    .other-courses-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 36px;
    }

    .other-course-card {
      background: var(--ada-card);
      border: 1px solid var(--ada-border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .other-course-card:hover {
      border-color: rgba(0, 229, 160, 0.2);
    }

    .other-course-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .other-course-emoji {
      font-size: 26px;
      flex-shrink: 0;
    }

    .other-course-text {
      flex: 1;
      min-width: 0;
    }

    .other-course-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ada-white);
      margin-bottom: 2px;
    }

    .other-course-tagline {
      font-size: 12px;
      color: var(--ada-grey);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .other-course-pct-col {
      flex-shrink: 0;
      text-align: right;
    }

    .other-course-pct-num {
      font-size: 20px;
      font-weight: 800;
      color: var(--ada-green);
      line-height: 1;
      display: block;
    }

    .other-course-pct-lbl {
      font-size: 10px;
      color: var(--ada-grey);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .other-course-expand {
      border-top: 1px solid var(--ada-border);
      padding: 16px 20px;
      display: none;
    }

    .other-course-expand.open {
      display: block;
    }

    .other-course-desc {
      font-size: 14px;
      color: var(--ada-light-grey);
      line-height: 1.65;
      margin-bottom: 12px;
    }

    .career-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .career-pill {
      padding: 4px 12px;
      background: var(--ada-border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ada-light-grey);
    }

    .other-course-entry {
      font-size: 12px;
      color: var(--ada-grey);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .other-course-entry strong {
      color: var(--ada-light-grey);
    }

    .other-course-more-link {
      font-size: 13px;
      font-weight: 700;
      color: var(--ada-green);
      text-decoration: none;
    }

    .other-course-more-link:hover {
      text-decoration: underline;
    }

    /* --- Results action buttons --- */
    .results-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 36px;
    }

    /* --- Parent summary teaser card --- */
    .parent-teaser {
      background: #1e1e1e;
      border: 1px solid #2f2f2f;
      border-radius: 12px;
      padding: 24px;
    }

    .parent-teaser-headline {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .parent-teaser-sub {
      font-size: 14px;
      color: var(--ada-grey);
      line-height: 1.65;
      margin-bottom: 20px;
    }

    /* ====================================================
       MODAL: SHARED
    ==================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 20px;
      opacity: 1;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      margin: auto;
      border-radius: 12px;
    }

    /* ====================================================
       MODAL: PARENT SUMMARY
    ==================================================== */
    .parent-modal-box {
      background: #ffffff;
      color: #111111;
      padding: 32px;
    }

    .parent-ada-logo {
      display: inline-flex;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #111111;
      margin-bottom: 4px;
    }

    .parent-ada-logo .dot-dark {
      display: inline-block;

  <script>
  (function () {

    // ================================================

          { text: "I'm open to it but not set on it", traits: { creator: 2, developer: 2 } },
          { text: "I'd rather go straight into a career or degree apprenticeship", traits: { apprenticeship: 3, developer: 2 } },
          { text: "I haven't decided yet", traits: { foundation: 2, innovator: 1 } }
        ]

        text: "Pick the phrase that sounds most like you:",
        options: [
          { text: "\u201cI want to understand how things work at a deep level\u201d", traits: { pioneer: 3 } },
          { text: "\u201cI want to understand people and make tech work for them\u201d", traits: { innovator: 3 } },

    ];

    var courses = {
      pioneer: {
        name: "Pioneer Pathway",

        badge: "\uD83D\uDD2D",

        qualification: "A-Level Maths + A-Level Computer Science",

        qualification: "A-Level Computer Science + A-Level Business or Psychology",
        equivalent: "2 A-Levels",
        entryRequirement: "Grade 5+ across 5 GCSEs including English and Maths",

      creator: {

        equivalent: "Full undergraduate degree",

        isTLevel: false,
        note: "This is a post-18 pathway. Complete your sixth form first, then apply."
      },
      foundation: {
        name: "Foundation Year",
        campus: "London",
        badge: "\uD83C\uDF31",

        description: "Not sure if you're ready for Level 3 yet? The Foundation Year is designed exactly for that. Build the technical and creative skills you need, then progress into one of Ada's specialist pathways with confidence.",

        qualification: "Foundation Year (Digital & Creative Pathway)",

    // ================================================
    // STATE
    // ================================================

    var state = {
      currentQ: 0,
      answers: [],
      scores: {},
      topMatch: null,
      sortedCourses: [],
      answering: false
    };

    // ================================================
    // UTILS
    // ================================================

    function qs(sel) { return document.querySelector(sel); }
    function qsa(sel) { return document.querySelectorAll(sel); }
    function el(tag, cls, html) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function showScreen(id) {
      qsa('.screen').forEach(function(s) {
        if (s.id === id) {
          s.classList.add('active');
          s.classList.remove('fading');
          s.scrollTop = 0;
        } else {
          s.classList.remove('active');
          s.classList.remove('fading');
        }
      });
    }

    function fadeToScreen(id) {
      var current = qs('.screen.active');
      if (current && current.id !== id) {
        current.classList.add('fading');
        setTimeout(function() {
          current.classList.remove('active');
          current.classList.remove('fading');
          showScreen(id);
        }, 260);
      } else {
        showScreen(id);
      }
    }

    function openModal(id) {
      qs('#' + id).classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(id) {
      qs('#' + id).classList.add('hidden');
      document.body.style.overflow = '';
    }

    var toastTimer = null;
    function showToast(msg) {
      var t = qs('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2800);
    }

    function animateCount(el, target, durationMs, suffix) {
      suffix = suffix || '';
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var progress = Math.min((ts - start) / durationMs, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.round(eased * target) + suffix;
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // ================================================
    // SCORING
    // ================================================

    function computeScores() {
      var raw = {};
      Object.keys(courses).forEach(function(k) { raw[k] = 0; });
      state.answers.forEach(function(ans) {
        Object.keys(ans.traits).forEach(function(trait) {
          if (raw[trait] !== undefined) raw[trait] += ans.traits[trait];
        });
      });
      state.scores = raw;

      var keys = Object.keys(raw);
      var maxRaw = 0;
      keys.forEach(function(k) { if (raw[k] > maxRaw) maxRaw = raw[k]; });

      var normalised = {};
      keys.forEach(function(k) {
        if (maxRaw === 0) {
          normalised[k] = 35;
        } else {
          var scaled = (raw[k] / maxRaw) * 95;
          normalised[k] = Math.max(Math.round(scaled), 35);
        }
      });

      var sorted = keys.slice().sort(function(a, b) { return normalised[b] - normalised[a]; });
      state.topMatch = sorted[0];
      state.sortedCourses = sorted.map(function(k) { return { key: k, pct: normalised[k] }; });
    }

    function saveResult() {
      localStorage.setItem('ada_quiz_result', JSON.stringify({
        timestamp: Date.now(),
        answers: state.answers,
        scores: state.scores,
        topMatch: state.topMatch,
        sortedCourses: state.sortedCourses
      }));
    }

    function initWelcome() {
      var saved = localStorage.getItem('ada_quiz_result');
      if (!saved) return;
      try {
        var result = JSON.parse(saved);
        var age = Date.now() - result.timestamp;
        if (age > 30 * 24 * 60 * 60 * 1000) return;
        var course = courses[result.topMatch];
        if (!course) return;
        var banner = qs('#returning-banner');
        var bannerText = qs('#returning-banner-text');
        bannerText.textContent = 'You matched with ' + course.name + ' last time. Retake or see your result?';
        banner.style.display = 'block';
      } catch (e) {}
    }

    function renderQuestion() {
      var q = questions[state.currentQ];
      var total = questions.length;
      var pctDone = (state.currentQ / total) * 100;

      qs('#progress-fill').style.width = pctDone + '%';
      qs('#quiz-q-count').textContent = (state.currentQ + 1) + ' of ' + total;

      var questionEl = qs('#question-text');
      questionEl.style.opacity = '0';
      questionEl.textContent = q.text;

      var listEl = qs('#options-list');
      listEl.innerHTML = '';

      q.options.forEach(function(opt, i) {
        var li = document.createElement('li');
        var btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.setAttribute('data-index', i);

        var textSpan = document.createElement('span');
        textSpan.textContent = opt.text;
        textSpan.style.flex = '1';

        var checkSpan = document.createElement('span');
        checkSpan.className = 'option-check';
        checkSpan.innerHTML = '<svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7.2L5.3 10.5L12 3.5" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

        btn.appendChild(textSpan);
        btn.appendChild(checkSpan);

        btn.addEventListener('click', function() {
          if (state.answering) return;
          handleAnswer(i, q, btn, listEl);
        });

        li.appendChild(btn);
        listEl.appendChild(li);
      });

      requestAnimationFrame(function() {
        questionEl.style.transition = 'opacity 0.25s ease';
        questionEl.style.opacity = '1';
      });

      state.answering = false;
    }

    function handleAnswer(optionIndex, q, btnEl, listEl) {
      state.answering = true;

      var opt = q.options[optionIndex];
      btnEl.classList.add('selected');

      // Disable all buttons
      listEl.querySelectorAll('.option-btn').forEach(function(b) {
        b.disabled = true;
      });

      state.answers.push({ questionId: q.id, optionIndex: optionIndex, traits: opt.traits });

      setTimeout(function() {
        state.currentQ++;
        if (state.currentQ >= questions.length) {
          finishQuiz();
        } else {
          renderQuestion();
        }
      }, 420);
    }

    function finishQuiz() {
      fadeToScreen('screen-calculating');
      setTimeout(function() {
        computeScores();
        saveResult();
        renderResults();
        fadeToScreen('screen-results');

    }

    function getWhyReasons(topKey) {
      var reasons = [];
      var maps = reasonMap[topKey] || [];
      maps.forEach(function(m) {
        if (reasons.length >= 3) return;
        var ans = state.answers.find(function(a) { return a.questionId === m.qId && a.optionIndex === m.oi; });
        if (ans) reasons.push(m.text);
      });
      var generics = genericReasons[topKey] || [];
      var gi = 0;
      while (reasons.length < 3 && gi < generics.length) {
        if (reasons.indexOf(generics[gi]) === -1) reasons.push(generics[gi]);
        gi++;
      }
      return reasons.slice(0, 3);
    }

    function detailRow(label, value) {

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

      var name = qs('#f-name').value.trim();
      var email = qs('#f-email').value.trim();
      var sixth = qs('#chk-sixth').checked;
      var appr = qs('#chk-appr').checked;

      if (!name) { showToast('Please enter your first name'); return; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Please enter a valid email address'); return;
      }

      localStorage.setItem('ada_email_signup', JSON.stringify({
        name: name, email: email,
        sixthForm: sixth, apprenticeship: appr,
        timestamp: Date.now()
      }));

      qs('#email-form-inner').innerHTML =
        '<div class="form-success">' +
          '<div class="form-success-check">\u2713</div>' +
          '<div class="form-success-title">You\'re on the list.</div>' +
          '<div class="form-success-body">We\'ll be in touch before applications open.</div>' +
          '<button class="btn btn-primary" onclick="App.closeEmailModal()">Done</button>' +
        '</div>';
    }

    // ================================================
    // PUBLIC API
    // ================================================

    window.App = {
      startQuiz: function() {
        state.currentQ = 0;
        state.answers = [];
        state.scores = {};
        state.topMatch = null;
        state.sortedCourses = [];
        state.answering = false;
        fadeToScreen('screen-quiz');
        renderQuestion();
      },

      showLastResult: function() {
        var saved = localStorage.getItem('ada_quiz_result');
        if (!saved) return;
        try {
          var result = JSON.parse(saved);
          state.scores = result.scores || {};
          state.answers = result.answers || [];
          state.topMatch = result.topMatch;
          state.sortedCourses = result.sortedCourses || [];
          if (!state.sortedCourses.length) computeScores();
          renderResults();
          fadeToScreen('screen-results');
        } catch (e) {}
      },

      retake: function() {
        localStorage.removeItem('ada_quiz_result');
        state.currentQ = 0;
        state.answers = [];
        state.scores = {};
        state.topMatch = null;
        state.sortedCourses = [];
        fadeToScreen('screen-welcome');
        initWelcome();
      },

      openParentModal: function() {
        buildParentSummary();
        openModal('modal-parent');
      },

      closeParentModal: function() {
        closeModal('modal-parent');
      },

      handleParentModalBgClick: function(e) {
        if (e.target === qs('#modal-parent')) App.closeParentModal();
      },

      copyParentSummary: function() {
        var text = buildCopyText();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            showToast('Copied to clipboard \u2713');
          }).catch(function() { fallbackCopy(text); });
        } else {
          fallbackCopy(text);
        }
      },

      openEmailModal: function() {
        renderEmailForm();
        openModal('modal-email');
      },

      closeEmailModal: function() {
        closeModal('modal-email');
      },

      handleEmailModalBgClick: function(e) {
        if (e.target === qs('#modal-email')) App.closeEmailModal();
      }
    };

    function fallbackCopy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Copied to clipboard \u2713');
      } catch (e) {
        showToast('Could not copy — please select manually');
      }
      document.body.removeChild(ta);
    }

    // ================================================
    // BOOT
    // ================================================

    initWelcome();

  })();
  </script>
</body>
</html>
